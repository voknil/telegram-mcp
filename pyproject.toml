[project]
name = "telegram-mcp"
version = "0.1.0"
description = "MCP server for a personal Telegram account (MTProto via Telethon)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "telethon>=1.44.0",
    "mcp>=2.0.0",
    "qrcode>=7.4.2",
    "pydantic-settings>=2.7",
]

[project.scripts]
telegram-mcp = "telegram_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_mcp"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[[tool.mypy.overrides]]
module = ["telethon.*", "qrcode.*"]
ignore_missing_imports = true
